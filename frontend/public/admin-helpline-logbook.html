<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpline Logbook</title>
    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css">
    <style>
        html,body{background:#F5F5F5;margin:0;padding:0;}
        #appMessageRegion{z-index:20000 !important;}   /* error and success messages must show above the pop-up forms */
        .hl-tabs{display:flex;gap:10px;margin:18px 0 4px;flex-wrap:wrap;}
        .hl-tab{border:2px solid #00C853;background:#fff;color:#067d45;padding:10px 22px;border-radius:99px;font:700 15px Arial,sans-serif;cursor:pointer;}
        .hl-tab.is-active{background:#00C853;color:#fff;}
        .hl-subtabs{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap;}
        .hl-sub{border:0;border-bottom:3px solid transparent;background:transparent;color:#555;padding:8px 16px;font:700 14px Arial,sans-serif;cursor:pointer;}
        .hl-sub.is-active{color:#067d45;border-bottom-color:#00C853;}
        .hl-panel{display:none;}.hl-panel.is-active{display:block;}
        .hl-stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;}
        .hl-stat{background:#fff;border-left:4px solid #00C853;border-radius:14px;padding:14px 22px;min-width:130px;box-shadow:0 4px 14px rgba(6,125,69,.08);}
        .hl-stat.red{border-left-color:#e11d48;}
        .hl-stat b{display:block;font-size:26px;}.hl-stat span{color:#666;font-size:13px;}
        .hl-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
        .hl-bar input,.hl-bar select{padding:9px 12px;border:1px solid #ddd;border-radius:8px;font:inherit;background:#fff;}
        .hl-bar label{font-size:12px;color:#666;display:block;margin-bottom:2px;}
        .hl-bar .hl-chk{display:flex;align-items:center;gap:6px;font-size:14px;color:#333;padding-bottom:10px;}
        .hl-bar .hl-chk input{padding:0;}
        .hl-card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(6,125,69,.08);}
        .hl-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
        .hl-plate{font-size:18px;font-weight:700;}
        .hl-case{display:inline-block;font:700 12px Arial,sans-serif;color:#067d45;background:#e8f8ee;border:1px solid #b7e8c8;border-radius:6px;padding:2px 8px;margin-left:8px;letter-spacing:.3px;}
        .hl-tag{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid;margin-left:6px;text-transform:uppercase;}
        .hl-Season{color:#1e40af;background:#eff6ff;border-color:#bfdbfe;}.hl-Hourly{color:#8a5a00;background:#fff4dc;border-color:#f0d594;}
        .hl-CLAMPED{color:#b91c1c;background:#fee2e2;border-color:#fecaca;font-weight:700;}.hl-RELEASED{color:#047857;background:#d1fae5;border-color:#a7f3d0;font-weight:700;}
        .hl-NA{color:#777;background:#f3f4f6;border-color:#e5e7eb;}
        .hl-INJ{color:#b91c1c;background:#fee2e2;border-color:#fecaca;font-weight:700;}.hl-NOPHOTO{color:#b45309;background:#fef3c7;border-color:#fde68a;font-weight:700;}.hl-PHOTO{color:#047857;background:#d1fae5;border-color:#a7f3d0;}
        .hl-meta{color:#666;font-size:13px;margin-top:6px;}.hl-row{margin-top:6px;font-size:14px;}.hl-row i{color:#666;font-style:normal;}
        .hl-empty{background:#fff;border-radius:14px;padding:28px;text-align:center;color:#666;}
        .hl-hint{color:#b91c1c;font-size:13px;}
        .hl-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
        .hl-thumbs img,.ph-grid img{width:96px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #ddd;cursor:zoom-in;background:#f0f0f0;}
        .hl-more{width:96px;height:72px;border-radius:8px;border:1px dashed #bbb;color:#555;font-size:13px;display:flex;align-items:center;justify-content:center;}
        .ph-block{border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin-top:10px;}
        .ph-block h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .ph-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
        .ph-grid figure{margin:0;font-size:11px;color:#666;max-width:96px;}
        .hl-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;}
        .hl-modal.is-open{display:flex;}
        .hl-box{background:#fff;border-radius:16px;padding:22px;width:min(620px,100%);max-height:92vh;overflow:auto;}
        .hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.hl-full{grid-column:1/-1;}
        .hl-grid label{font-size:13px;color:#666;display:block;margin-bottom:3px;}
        .hl-grid input,.hl-grid select,.hl-grid textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #ddd;border-radius:8px;font:inherit;}
        .hl-release{grid-column:1/-1;border:2px dashed #a7f3d0;border-radius:12px;padding:12px;}
        .hl-release .hl-grid{margin-top:8px;}
        .hl-photobox{grid-column:1/-1;border:2px dashed #fecaca;border-radius:12px;padding:12px;background:#fffafa;}
        .hl-photobox.ok{border-color:#a7f3d0;background:#f7fdf9;}
        .hl-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
        .au-item{border-left:4px solid #00C853;background:#f7fbf8;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;}
        .au-item.upd{border-left-color:#f59e0b;}.au-item.imp{border-left-color:#3b82f6;}.au-item.pho{border-left-color:#8b5cf6;}
        .au-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;}.au-when{color:#666;font-weight:400;font-size:13px;}
        .au-chg{margin-top:6px;font-size:13px;}.au-chg i{color:#666;font-style:normal;}.au-old{color:#b91c1c;text-decoration:line-through;}.au-new{color:#047857;font-weight:700;}
        #lbModal{background:rgba(0,0,0,.85);z-index:9998;flex-direction:column;gap:10px;}
        #lbModal img{max-width:96vw;max-height:80vh;border-radius:8px;background:#fff;}
        #lbCap{color:#fff;font-size:14px;text-align:center;}#lbCap a{color:#7dffb0;}
        @media(max-width:560px){.hl-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <div class="page admin-page">
        <nav class="navbar">
            <div class="container">
                <div class="logo" onclick="window.location.href='admin-dashboard.html'" style="cursor:pointer;">
                    <span class="logo-text">Hi<span class="logo-highlight">speedcity</span></span>
                    <span class="admin-badge">Admin</span>
                </div>
                <a href="index.html" class="logout-link" data-testid="logout-link">Logout</a>
            </div>
        </nav>

        <div class="container" style="padding-top:28px;">
            <div class="applications-header">
                <div><h1 data-testid="helpline-title">Helpline Logbook</h1></div>
                <button class="btn btn-secondary" onclick="window.location.href='admin-dashboard.html'" data-testid="back-dashboard-btn">Back to Dashboard</button>
            </div>

            <div class="hl-tabs" id="mainTabs"></div>

            <!-- ===================== PROBLEM LOG (case type HL) ===================== -->
            <div class="hl-panel is-active" id="panel_problems">
                <div class="hl-stats">
                    <div class="hl-stat"><b id="hlTotal">0</b><span>Total Records</span></div>
                    <div class="hl-stat"><b id="hlSeason">0</b><span>Season Parker</span></div>
                    <div class="hl-stat"><b id="hlHourly">0</b><span>Hourly Parker</span></div>
                </div>
                <div class="hl-bar">
                    <div><label>Search</label><input id="hlSearch" placeholder="Car plate or case number..." style="min-width:230px;"></div>
                    <div><label>Type of parker</label><select id="hlType"><option value="">All types</option><option>Season</option><option>Hourly</option></select></div>
                    <div><label>From date</label><input type="date" id="hlFrom"></div>
                    <div><label>To date</label><input type="date" id="hlTo"></div>
                    <span id="hlCount" style="color:#666;font-size:13px;padding-bottom:10px;"></span>
                    <span style="flex:1"></span>
                    <button class="btn btn-primary" id="hlAdd">+ New Entry</button>
                    <button class="btn btn-secondary" id="hlCsv">Export CSV</button>
                    <button class="btn btn-secondary" id="hlImport" style="display:none;">Import Old Logbook (one time)</button>
                </div>
                <div id="hlRange" class="hl-hint"></div>
                <div id="hlList"></div>
            </div>
            <!-- the Car Clamping, Accident and Oil Leak panels are created by the script below -->
        </div>
    </div>

    <!-- Problem log form -->
    <div class="hl-modal" id="hlModal">
        <div class="hl-box">
            <h3 id="hlTitle" style="margin-top:0;">New Entry</h3>
            <div class="hl-grid">
                <div><label>Date *</label><input type="date" id="f_date"></div>
                <div><label>Car Plate No. *</label><input id="f_plate"></div>
                <div><label>Entry Time</label><input id="f_entry" placeholder="e.g. 14:28"></div>
                <div><label>Exit Time</label><input id="f_exit" placeholder="e.g. 16:37"></div>
                <div><label>Exit Date <small>(only if overnight)</small></label><input type="date" id="f_exitDate"></div>
                <div><label>Type of Parker *</label><select id="f_type"><option>Season</option><option>Hourly</option></select></div>
                <div class="hl-full"><label>Station *</label><select id="f_station"></select></div>
                <div class="hl-full"><label>Problem *</label><textarea id="f_reason" rows="2"></textarea></div>
                <div class="hl-full"><label>Solution *</label><textarea id="f_solution" rows="2"></textarea></div>
                <div class="hl-full"><label>Remarks</label><input id="f_remarks"></div>
            </div>
            <div class="hl-actions">
                <button class="btn btn-secondary" id="hlCancel">Cancel</button>
                <button class="btn btn-primary" id="hlSave">Save</button>
            </div>
        </div>
    </div>

    <!-- Case form for Car Clamping, Accident and Oil Leak (built by the script) -->
    <div class="hl-modal" id="csModal">
        <div class="hl-box">
            <h3 id="csTitle" style="margin-top:0;">New</h3>
            <div class="hl-grid" id="csGrid"></div>
            <div class="hl-actions">
                <button class="btn btn-secondary" id="csCancel">Cancel</button>
                <button class="btn btn-primary" id="csSave">Save</button>
            </div>
        </div>
    </div>

    <!-- Audit history (read only) -->
    <div class="hl-modal" id="auModal">
        <div class="hl-box">
            <h3 id="auTitle" style="margin-top:0;">History</h3>
            <div id="auList"></div>
            <div class="hl-actions"><button class="btn btn-secondary" id="auClose">Close</button></div>
        </div>
    </div>

    <!-- Photo viewer -->
    <div class="hl-modal" id="lbModal">
        <img id="lbImg" alt="Photo proof">
        <div id="lbCap"></div>
        <button class="btn btn-secondary" id="lbClose" style="background:#fff;">Close</button>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>

/* ---------- small helpers ---------- */
const $hl = id => document.getElementById(id);
const hlFmt = d => (d ? d.split('-').reverse().join('/') : '');
const hlMsg = (m, t) => (typeof showAppMessage === 'function' ? showAppMessage(m, t || 'error') : alert(m));
const hlPad = n => String(n).padStart(2, '0');
const hlToday = () => { const d = new Date(); return d.getFullYear() + '-' + hlPad(d.getMonth() + 1) + '-' + hlPad(d.getDate()); };
const hlNow = () => { const d = new Date(); return hlPad(d.getHours()) + ':' + hlPad(d.getMinutes()); };
const hlSq = s => String(s || '').toLowerCase().replace(/\s/g, '');
const hlInRange = (date, from, to) => (!from || date >= from) && (!to || date <= to);
const hlThumb = url => (/^https:\/\/res\.cloudinary\.com\/.+\/upload\//.test(url) ? url.replace('/upload/', '/upload/c_fill,w_240,h_180,q_auto,f_auto/') : url);
const hlMatch = (r, q) => !q || hlSq(r.plate).includes(q) || hlSq(r.caseNo).includes(q);

/* ---------- photo helpers ---------- */
// shrink big phone photos before upload (keeps them clear, makes upload fast). Falls back to the original file.
async function hlCompress(file) {
    try {
        if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 700 * 1024) return file;
        const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
        const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
        canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.86));
        if (!blob || blob.size >= file.size) return file;
        return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch (e) { return file; }
}
async function hlPrepPhotos(fileList) {
    const out = [];
    for (const f of Array.from(fileList || [])) out.push(await hlCompress(f));
    return out;
}
function hlPhotoCheck(files) {
    for (const f of files) {
        if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return 'Only JPG, PNG or WEBP photos are accepted.';
        if (f.size > 8 * 1024 * 1024) return 'A photo is larger than 8 MB.';
    }
    return files.length > 4 ? 'Upload at most 4 photos at a time.' : '';
}

/* =====================================================================
   PROBLEM LOG  (case type HL)
   ===================================================================== */
const HL_STATIONS = ['ENTRY 101', 'ENTRY 102', 'EXIT 201', 'EXIT 202'];
const HL_FIELDS = ['date', 'plate', 'entry', 'exit', 'exitDate', 'station', 'type', 'reason', 'solution', 'remarks'];
const HL_UPPER = ['plate', 'entry', 'exit', 'station', 'reason', 'solution', 'remarks'];
let hlLogs = [], hlEditId = null;

async function hlLoad() {
    const res = await requestJson('/admin/helpline-logs', { loadingMessage: 'Loading logbook...' });
    hlLogs = Array.isArray(res.logs) ? res.logs : [];
    hlRender();
}

function hlRender() {
    const q = hlSq($hl('hlSearch').value), t = $hl('hlType').value, from = $hl('hlFrom').value, to = $hl('hlTo').value;
    $hl('hlRange').textContent = from && to && from > to ? 'The From date is after the To date.' : '';
    const rows = hlLogs.filter(r => (!t || r.type === t) && hlInRange(r.date, from, to) && hlMatch(r, q));
    $hl('hlTotal').textContent = hlLogs.length;
    $hl('hlSeason').textContent = hlLogs.filter(r => r.type === 'Season').length;
    $hl('hlHourly').textContent = hlLogs.filter(r => r.type === 'Hourly').length;
    $hl('hlCount').textContent = rows.length + ' of ' + hlLogs.length + ' records';
    $hl('hlImport').style.display = hlLogs.length > 0 ? 'none' : '';
    $hl('hlList').innerHTML = rows.map(r => `
        <div class="hl-card">
            <div class="hl-top"><div><span class="hl-plate">${escapeHtml(r.plate)}</span>${r.caseNo ? `<span class="hl-case">${escapeHtml(r.caseNo)}</span>` : ''}${r.type ? `<span class="hl-tag hl-${escapeHtml(r.type)}">${escapeHtml(r.type)}</span>` : ''}</div><div class="hl-meta">${hlFmt(r.date)}</div></div>
            <div class="hl-meta">Entry: ${escapeHtml(r.entry) || '-'} &nbsp;|&nbsp; Exit: ${escapeHtml(r.exit) || '-'}${r.exitDate && r.exitDate > r.date ? ' (' + hlFmt(r.exitDate) + ')' : ''} &nbsp;|&nbsp; Station: ${escapeHtml(r.station) || '-'}</div>
            <div class="hl-row"><i>Problem:</i> ${escapeHtml(r.reason) || '-'}</div>
            <div class="hl-row"><i>Solution:</i> ${escapeHtml(r.solution) || '-'}</div>
            ${r.remarks ? `<div class="hl-row"><i>Remarks:</i> ${escapeHtml(r.remarks)}</div>` : ''}
            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-secondary" onclick="hlEdit('${escapeHtml(r.logId)}')">Edit</button><button class="btn btn-secondary" onclick="auOpen('logs','${escapeHtml(r.logId)}')">History</button></div>
        </div>`).join('') || '<div class="hl-empty">No records found.</div>';
}

function hlOpen(r) {
    hlEditId = r ? r.logId : null;
    $hl('hlTitle').textContent = r ? 'Edit Entry' + (r.caseNo ? ': ' + r.caseNo : '') : 'New Entry';
    const legacy = r && r.station && !HL_STATIONS.includes(r.station) ? [r.station] : [];
    $hl('f_station').innerHTML = '<option value="">Select station</option>' + [...HL_STATIONS, ...legacy].map(s => `<option>${escapeHtml(s)}</option>`).join('');
    HL_FIELDS.forEach(f => { $hl('f_' + f).value = r ? (r[f] || '') : (f === 'date' ? hlToday() : f === 'type' ? 'Season' : ''); });
    $hl('hlModal').classList.add('is-open');
}
function hlEdit(id) { hlOpen(hlLogs.find(r => r.logId === id)); }
function hlClose() { $hl('hlModal').classList.remove('is-open'); }

async function hlSave() {
    const o = {};
    HL_FIELDS.forEach(f => { o[f] = $hl('f_' + f).value.trim(); });
    HL_UPPER.forEach(k => { o[k] = o[k].toUpperCase(); });
    const old = hlEditId ? (hlLogs.find(r => r.logId === hlEditId) || {}) : null;
    // new entries need every required field; old records may keep a field blank if it was already blank
    const need = (k, label) => (!o[k] && (!old || old[k])) ? label : null;
    const missing = [need('date', 'Date'), need('plate', 'Car Plate'), need('station', 'Station'), need('reason', 'Problem'), need('solution', 'Solution')].filter(Boolean);
    if (missing.length) { hlMsg('Please fill: ' + missing.join(', ') + '.'); return; }
    if (o.entry && o.exit && !o.exitDate && /^\d{1,2}[:.]\d{2}$/.test(o.entry) && /^\d{1,2}[:.]\d{2}$/.test(o.exit) && o.exit.replace('.', ':').padStart(5, '0') < o.entry.replace('.', ':').padStart(5, '0')) {
        hlMsg('Exit time is earlier than entry time. If the car stayed overnight, enter the Exit Date.'); return;
    }
    const btn = $hl('hlSave'); btn.disabled = true;
    try {
        const out = await requestJson(hlEditId ? '/admin/helpline-logs/' + encodeURIComponent(hlEditId) : '/admin/helpline-logs', {
            method: hlEditId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o), loadingMessage: 'Saving...'
        });
        hlClose(); await hlLoad();
        if (!hlEditId && out.message) hlMsg(out.message, 'success');
    } catch (e) { hlMsg(e.message); }
    btn.disabled = false;
}

async function hlImportLegacy() {
    const legacy = HL_LEGACY;
    if (!confirm('Import ' + legacy.length + ' old logbook records? This can only be done once. Each record gets its own case number.')) return;
    try {
        const out = await requestJson('/admin/helpline-logs/import-legacy', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(legacy), loadingMessage: 'Importing ' + legacy.length + ' records...'
        });
        hlMsg(out.message, 'success'); await hlLoad();
    } catch (e) { hlMsg(e.message); }
}

/* ---------- the case form (new / edit / release) ---------- */
let csKey = null;
const csVisible = f => !f.showWhen || (document.getElementById('cs_' + f.showWhen[0]) && $hl('cs_' + f.showWhen[0]).value === f.showWhen[1]);

function csFieldHtml(f) {

function csBuild(c, mode, rec) {
    let html = '', lastBox = null;
    const flush = () => { if (lastBox) { html += '</div></div>'; lastBox = null; } };
    c.fields.forEach(f => {
        if (f.hideNew && mode === 'new') return;
        if (f.box !== lastBox) { flush(); if (f.box) { html += `<div class="hl-release" id="cs_box_${f.box}"><b style="color:#047857;">Release details</b><div class="hl-grid">`; lastBox = f.box; } }
        html += csFieldHtml(f);
    });
    flush();
    c.photoInputs.forEach(p => {
        if (p.mode === 'new' && mode !== 'new') return;
        if (p.mode === 'edit' && mode === 'new') return;
        const existing = p.photoLabel && rec && (rec.photos || []).some(x => x.label === p.photoLabel);
        html += `<div class="hl-photobox${existing ? ' ok' : ''}" id="cs_pbox_${p.id}"><label style="font-weight:700;color:#333;">${escapeHtml(p.text)}${existing ? ' (already uploaded, you can add more)' : ''}</label>

    });

    $hl('csGrid').innerHTML = html;
}

function csRefresh() {
    const c = SECTIONS[csKey];
    c.fields.forEach(f => { if (f.showWhen && f.box) { const b = $hl('cs_box_' + f.box); if (b) b.style.display = csVisible(f) ? '' : 'none'; } });
    c.photoInputs.forEach(p => { if (p.showWhen) { const b = $hl('cs_pbox_' + p.id); if (b) b.style.display = $hl('cs_' + p.showWhen[0]) && $hl('cs_' + p.showWhen[0]).value === p.showWhen[1] ? '' : 'none'; } });
}

function csOpen(k, rec, mode) {
    csKey = k; const c = SECTIONS[k], st = S[k];
    st.editId = rec ? rec.logId : null; st.mode = mode;
    $hl('csTitle').textContent = (mode === 'release' ? 'Release Vehicle' : (rec ? 'Edit ' + c.title : 'New ' + c.title)) + (rec ? ': ' + rec.caseNo : '');
    csBuild(c, mode, rec);
    c.fields.forEach(f => {
        const el = $hl('cs_' + f.k); if (!el) return;
        const def = f.def !== undefined ? f.def : (f.t === 'date' ? hlToday() : f.t === 'select' ? f.opts[0] : '');
        el.value = rec ? (rec[f.k] != null ? rec[f.k] : def) : def;
    });
    if (mode === 'release') {
        $hl('cs_status').value = 'RELEASED'; $hl('cs_releaseDate').value = hlToday(); $hl('cs_releaseTime').value = hlNow();
    }
    c.fields.forEach(f => { const el = $hl('cs_' + f.k); if (el && f.k === 'status') el.addEventListener('change', csRefresh); });

    $hl('csModal').classList.add('is-open');

function csEdit(k, id) { csOpen(k, S[k].logs.find(r => r.logId === id), 'edit'); }
function csRelease(id) { csOpen('clamping', S.clamping.logs.find(r => r.logId === id), 'release'); }
function csClose() { $hl('csModal').classList.remove('is-open'); }

async function csSave() {
    const k = csKey, c = SECTIONS[k], st = S[k], editing = !!st.editId;
    const rec = editing ? S[k].logs.find(r => r.logId === st.editId) : null;
    const o = {}, missing = [];
    c.fields.forEach(f => {
        const el = $hl('cs_' + f.k);
        if (!el) { o[f.k] = f.def !== undefined ? f.def : ''; return; }
        if (!csVisible(f)) { o[f.k] = ''; return; }
        let v = el.value.trim(); if (f.upper) v = v.toUpperCase();
        o[f.k] = f.t === 'number' ? (v === '' ? null : Number(v)) : v;
        if (f.req && v === '') missing.push(f.l);
    });
    if (missing.length) { hlMsg('Please fill: ' + missing.join(', ') + '.'); return; }
    const btn = $hl('csSave'); btn.disabled = true;
    try {
        if (!editing) {
            // NEW case: the record and its photos are sent together
            const main = c.photoInputs.find(p => p.mode === 'new');
            const files = await hlPrepPhotos($hl('cs_' + main.id).files);
            if (main.req && !files.length) { hlMsg('Please choose the photo of the clamped car showing the car plate. It is required.'); btn.disabled = false; return; }
            const bad = hlPhotoCheck(files); if (bad) { hlMsg(bad); btn.disabled = false; return; }
            const fd = new FormData(); fd.append('record', JSON.stringify(o));
            if (main.pickLabel && files.length) fd.append('photoLabel', $hl('cs_pl_' + main.id).value);
            files.forEach(f => fd.append('photos', f));
            const out = await requestFormData('/admin/helpline-' + c.path, fd, { loadingMessage: 'Saving ' + c.title + ' and uploading photos...' });
            csClose(); await secLoad(k); hlMsg(out.message, 'success');
        } else {
            // EDIT / RELEASE: the release photo (clamping) is uploaded first, then the record is saved
            const relInput = c.photoInputs.find(p => p.mode === 'edit');
            if (relInput && o.status === 'RELEASED') {
                const files = await hlPrepPhotos($hl('cs_' + relInput.id).files);
                const have = (rec.photos || []).some(p => p.label === relInput.photoLabel);
                if (!files.length && !have) { hlMsg('Please choose the photo of the released car. It is required to release the vehicle.'); btn.disabled = false; return; }
                if (files.length) {
                    const bad = hlPhotoCheck(files); if (bad) { hlMsg(bad); btn.disabled = false; return; }
                    const fd = new FormData(); fd.append('label', relInput.photoLabel); files.forEach(f => fd.append('photos', f));
                    const up = await requestFormData('/admin/helpline-' + c.path + '/' + encodeURIComponent(st.editId) + '/photos', fd, { loadingMessage: 'Uploading photo...' });
                    rec.photos = (rec.photos || []).concat(up.photos || []);
                }
            }
            await requestJson('/admin/helpline-' + c.path + '/' + encodeURIComponent(st.editId), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o), loadingMessage: 'Saving...' });
            csClose(); await secLoad(k);
        }
    } catch (e) { hlMsg(e.message); }
    btn.disabled = false;
}

/* ---------- CSV ---------- */
function hlDownloadCsv(name, head, rows) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const blob = new Blob(['\ufeff' + [head.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function hlCsv() {
    const q = hlSq($hl('hlSearch').value), t = $hl('hlType').value, from = $hl('hlFrom').value, to = $hl('hlTo').value;
    const rows = hlLogs.filter(r => (!t || r.type === t) && hlInRange(r.date, from, to) && hlMatch(r, q));
    hlDownloadCsv('helpline-problem-log.csv', ['No', 'Case No.', 'Date', 'Car Plate No.', 'Entry Time', 'Exit Date', 'Exit Time', 'Station', 'Problem', 'Solution', 'Type of Parker', 'Remarks'],
        [...rows].sort((a, b) => a.date.localeCompare(b.date)).map((r, i) => [i + 1, r.caseNo, hlFmt(r.date), r.plate, r.entry, hlFmt(r.exitDate), r.exit, r.station, r.reason, r.solution, r.type, r.remarks]));
}
function secCsv(k) {
    const c = SECTIONS[k];
    const q = hlSq($hl(k + '_q').value), from = $hl(k + '_from').value, to = $hl(k + '_to').value, st = c.statusFilter ? $hl(k + '_status').value : '';
    const rows = S[k].logs.filter(r => (!st || r.status === st) && hlInRange(r.date, from, to) && hlMatch(r, q));
    hlDownloadCsv(c.path + '-cases.csv', c.csv.head, [...rows].sort((a, b) => a.date.localeCompare(b.date)).map((r, i) => {
        const base = c.csv.row(r); const ph = r.photos || [];
        return [i + 1, ...base, ph.length, ph.map(p => p.label + ': ' + p.url).join('  ')];
    }));
}

                ${a.note && a.action !== 'UPDATE' ? `<div class="au-chg">${escapeHtml(a.note)}</div>` : ''}
                ${(a.changes || []).map(c => a.action === 'PHOTO' ? `<div class="au-chg"><i>Photo:</i> <span class="au-new">${escapeHtml(c.to)}</span></div>` :
                    `<div class="au-chg"><i>${escapeHtml(AU_LABEL[c.field] || c.field)}:</i> <span class="au-old">${escapeHtml(auVal(c.field, c.from)) || '(empty)'}</span> &rarr; <span class="au-new">${escapeHtml(auVal(c.field, c.to)) || '(empty)'}</span></div>`).join('')}
            </div>`).join('') || '<div class="hl-empty">No history yet. Records imported from the old logbook show history from their first edit.</div>';
    } catch (e) { $hl('auList').innerHTML = '<div class="hl-empty">' + escapeHtml(e.message) + '</div>'; }
}

/* =====================================================================
   START
   ===================================================================== */
window.addEventListener('DOMContentLoaded', async function () {
    try { await requestJson('/admin/me', { skipLoading: true }); }
    catch (e) { hlMsg('Please log in to access the Helpline Logbook.'); setTimeout(() => { window.location.href = 'admin-login.html'; }, 1200); return; }

    // tabs + the three generated panels
    $hl('mainTabs').innerHTML = HL_TABS.map((t, i) => `<button class="hl-tab${i === 0 ? ' is-active' : ''}" id="tab_${t[0]}" data-testid="tab-${t[0]}">${t[1]}</button>`).join('');
    HL_TABS.forEach(t => $hl('tab_' + t[0]).addEventListener('click', () => hlShowTab(t[0])));
    Object.keys(SECTIONS).forEach(k => {
        const p = document.createElement('div'); p.className = 'hl-panel'; p.id = 'panel_' + k; p.innerHTML = secPanelHtml(SECTIONS[k]);
        $hl('panel_problems').parentNode.appendChild(p);
        $hl(k + '_subRec').addEventListener('click', () => secSub(k, 'rec'));
        $hl(k + '_subPho').addEventListener('click', () => secSub(k, 'pho'));
        [k + '_q', k + '_from', k + '_to', k + '_status'].forEach(id => { if ($hl(id)) $hl(id).addEventListener('input', () => secRender(k)); });
        [k + '_pq', k + '_pfrom', k + '_pto', k + '_pmiss'].forEach(id => $hl(id).addEventListener('input', () => secRenderPhotos(k)));
        $hl(k + '_add').addEventListener('click', () => csOpen(k, null, 'new'));
        $hl(k + '_csv').addEventListener('click', () => secCsv(k));
    });

    // problem log
    ['hlSearch', 'hlType', 'hlFrom', 'hlTo'].forEach(id => $hl(id).addEventListener('input', hlRender));
    $hl('hlAdd').addEventListener('click', () => hlOpen(null));
    $hl('hlCancel').addEventListener('click', hlClose);
    $hl('hlSave').addEventListener('click', hlSave);
    $hl('hlCsv').addEventListener('click', hlCsv);
    $hl('hlImport').addEventListener('click', hlImportLegacy);
    // shared pop-ups
    $hl('csCancel').addEventListener('click', csClose);
    $hl('csSave').addEventListener('click', csSave);
    $hl('auClose').addEventListener('click', () => $hl('auModal').classList.remove('is-open'));
    $hl('lbClose').addEventListener('click', () => $hl('lbModal').classList.remove('is-open'));
    $hl('lbModal').addEventListener('click', e => { if (e.target === $hl('lbModal')) $hl('lbModal').classList.remove('is-open'); });

    const want = (location.hash || '').replace('#', '');
    if (HL_TABS.some(t => t[0] === want)) hlShowTab(want);
    try { await hlLoad(); } catch (e) { hlMsg(e.message); }
    for (const k of Object.keys(SECTIONS)) { try { await secLoad(k); } catch (e) { hlMsg(e.message); } }
});
    </script>
